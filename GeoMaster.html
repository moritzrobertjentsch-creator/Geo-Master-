<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GeoMaster</title><meta name="theme-color" content="#2879db"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#eef3f8;--ink:#17283e;--muted:#60738b;--blue:#2879db;--green:#20a56b;--red:#e45358;--gold:#e2aa31;--card:#fff;--line:#dce5ee}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eaf3ff,#f7f9fc 50%,#eaf8f1);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}#app{max-width:1100px;margin:auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:28px;letter-spacing:-1px}.brand span{color:var(--blue)}.tag{color:var(--muted);font-size:13px}.hero{background:linear-gradient(125deg,#2879db,#50a4ee);color:white;border-radius:24px;padding:25px 24px;margin-bottom:20px;box-shadow:0 14px 32px #2879db26}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#e8f4ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 24px #19395b0b}.tile{padding:22px;cursor:pointer;transition:.2s;min-height:130px}.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px #19395b15;border-color:#a9c9ed}.panel{animation:panelIn .32s ease-out}.tile{animation:tileIn .35s ease-out both}.feedback{animation:feedbackPop .24s ease-out}.leaflet-interactive{transition:fill-opacity .22s ease,fill .22s ease}@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes tileIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes feedbackPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.tile .emoji{font-size:30px}.tile h2{margin:8px 0 5px;font-size:20px}.tile p{margin:0;color:var(--muted);font-size:14px}.panel{padding:18px}.hidden{display:none!important}button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button.secondary{background:#e9f1fb;color:#235a99}button.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#e45358}button.gold{background:#e6b33d;color:#34270b}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.heading{font-size:22px;font-weight:800;margin:0 0 12px}.sub{color:var(--muted)}.continent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}.continent{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;color:#17283e!important;font-weight:700!important;font-size:16px;display:block;min-height:58px}.continent:hover{border-color:#7fb5ef;background:#f7fbff;color:#17283e!important}.continent:focus-visible{outline:3px solid #2879db;outline-offset:2px}.continent:focus-visible{outline:3px solid #2879db;outline-offset:2px}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.progress{height:8px;background:#dce6f0;border-radius:20px;overflow:hidden;margin:8px 0 16px}.progress>div{height:100%;background:linear-gradient(90deg,#2879db,#58b0f0);width:0;transition:width .25s}.question{text-align:center;padding:12px 8px}.question h2{margin:5px 0 14px;font-size:25px}.flag{font-size:84px;line-height:1.1;min-height:100px;display:flex;align-items:center;justify-content:center}.flag img{height:90px;max-width:150px;object-fit:contain;box-shadow:0 3px 14px #102e4c20;border-radius:7px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.choice{background:#f7faff;color:var(--ink);border:2px solid #e1eaf4;min-height:65px}.choice.correct{background:#e0f7eb;border-color:#25ad70;color:#157249}.choice.wrong{background:#fff0f0;border-color:#e45458;color:#a83236}.mapwrap{position:relative;height:min(84vh,1000px);min-height:620px;border-radius:18px;overflow:hidden;border:1px solid #d5e0eb;background:#e8eff6}.map{height:100%;width:100%}.map .leaflet-container{background:#e8eff6;touch-action:pan-x pan-y}.map .leaflet-interactive{cursor:pointer;pointer-events:auto}.map-controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.feedback{font-weight:800;min-height:28px;margin:10px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{padding:12px 18px;border-radius:14px;background:#f2f7fc;font-weight:800}.review{display:grid;gap:8px;margin-top:12px}.reviewrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.badge{border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800}.b-ok{background:#dff6e9;color:#147449}.b-no{background:#ffe4e4;color:#a63235}.b-reveal{background:#fff0c8;color:#7c5710}.countrylist{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}.countrylist th,.countrylist td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.countrylist th{background:#eef5fc;position:sticky;top:0}.listbox{max-height:65vh;overflow:auto;border-radius:14px;border:1px solid var(--line)}.listsearch{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0;font-size:16px}.footer{color:var(--muted);text-align:center;font-size:12px;margin:24px 0}.leaflet-tooltip.country-label{background:transparent;border:0;box-shadow:none;color:#34465b;font-size:10px;font-weight:700;text-shadow:0 1px 3px #fff,0 0 4px white;white-space:nowrap}.leaflet-tooltip.country-label:before{display:none}.leaflet-control-attribution{font-size:9px!important}@media(max-width:600px){#app{padding:10px}.mapwrap{height:72vh;min-height:480px}.brand{font-size:23px}.hero{padding:20px}.hero h1{font-size:24px}.choices{grid-template-columns:1fr}.mapwrap{min-height:560px;height:74vh}.question h2{font-size:21px}.panel{padding:13px}}

#resultFX{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.85);background:rgba(18,25,40,.0);transition:opacity .16s,transform .16s}
#resultFX.show{opacity:1;transform:scale(1);background:rgba(18,25,40,.28)}
#resultFX .fx-card{padding:28px 42px;border-radius:24px;color:white;font-size:clamp(30px,8vw,62px);font-weight:900;text-align:center;box-shadow:0 20px 60px #0003;animation:fxBounce .55s ease-out}
#resultFX.good .fx-card{background:linear-gradient(135deg,#12a86c,#34d399)} #resultFX.bad .fx-card{background:linear-gradient(135deg,#d84343,#fb7185)}
@keyframes fxBounce{0%{transform:scale(.65) rotate(-5deg)}65%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes mapPulse{0%{filter:brightness(1)}45%{filter:brightness(1.35)}100%{filter:brightness(1)}}
.map-answer-pulse{animation:mapPulse .5s ease}

#resultFX{overflow:hidden;background:rgba(12,22,38,.0)}#resultFX.show{background:rgba(12,22,38,.58)}
#resultFX .fx-card{position:relative;z-index:2;min-width:min(80vw,520px);padding:clamp(20px,6vw,42px);font-size:clamp(38px,10vw,86px);border:3px solid rgba(255,255,255,.8);text-shadow:0 3px 16px #0003}
#resultFX.bad .fx-card{background:linear-gradient(145deg,#b91c1c,#f43f5e);animation:fxShake .55s ease-out}
#resultFX.good .fx-card{background:linear-gradient(145deg,#059669,#34d399)}
#resultFX .bigmark{font-size:1.65em;line-height:1;display:block;animation:markPop .65s cubic-bezier(.2,.9,.2,1.3)}
#resultFX .fx-detail{font-size:clamp(18px,4.5vw,28px);margin-top:14px;line-height:1.25}
.fx-particle{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;opacity:0;animation:burst 1.65s ease-out forwards;z-index:1}
#resultFX.good .fx-particle{background:var(--particle);box-shadow:0 0 12px var(--particle)}
#resultFX.bad .fx-particle{display:none}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0)}}
@keyframes markPop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1);opacity:1}}
@keyframes fxShake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(12px) rotate(2deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}

.list-toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.list-toggles button{background:#eef5fc;color:#235a99;border:1px solid #dce5ee;padding:9px 12px}.list-toggles button.active{background:#2879db;color:white;border-color:#2879db}.countrylist.hide-flag th:nth-child(1),.countrylist.hide-flag td:nth-child(1),.countrylist.hide-name th:nth-child(2),.countrylist.hide-name td:nth-child(2),.countrylist.hide-capital th:nth-child(3),.countrylist.hide-capital td:nth-child(3){display:none}.tile:active,.continent:active,button:active{transform:scale(.97);filter:brightness(.97)}.tile{transition:transform .16s ease,box-shadow .16s ease}
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e7f2ff,#f7fbff);transition:opacity .45s ease,visibility .45s ease}
#bootLoader.done{opacity:0;visibility:hidden;pointer-events:none}.bootbox{text-align:center;color:#173454;font-family:system-ui,sans-serif}.bootGlobe{font-size:76px;display:inline-block;animation:globeSpin 2s ease-in-out infinite, globeBob 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 8px 12px #2879db35)}.bootTitle{font-size:29px;font-weight:850;letter-spacing:-.8px;margin-top:6px}.bootTitle span{color:#2879db}.bootSub{color:#66809c;font-size:14px;margin:8px 0 18px}.bootTrack{width:210px;height:7px;border-radius:8px;background:#d6e6f7;overflow:hidden;margin:auto}.bootTrack i{height:100%;width:40%;display:block;border-radius:8px;background:linear-gradient(90deg,#2879db,#5db7ff);animation:loadSweep 1.1s ease-in-out infinite}.bootDots{margin-top:12px;color:#7b95af;letter-spacing:4px;animation:dotsPulse 1s infinite alternate}@keyframes globeSpin{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}@keyframes globeBob{to{translate:0 -9px}}@keyframes loadSweep{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}@keyframes dotsPulse{to{opacity:.4}}@media(prefers-reduced-motion:reduce){.bootGlobe,.bootTrack i,.bootDots{animation:none}}
/* Stronger, visible tap feedback */.tile,.continent,button{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s;position:relative;overflow:hidden}.tile:active,.continent:active,button:active{transform:scale(.94);filter:brightness(1.06);box-shadow:0 0 0 4px #2879db2b,0 8px 20px #2879db22}.tapPulse{animation:tapPulse .38s ease-out}@keyframes tapPulse{0%{transform:scale(.96);box-shadow:0 0 0 0 #2879db66}70%{box-shadow:0 0 0 9px #2879db00}100%{transform:scale(1);box-shadow:none}}
</style></head><body><div id="bootLoader"><div class="bootbox"><div class="bootGlobe">🌍</div><div class="bootTitle">Geo<span>Master</span></div><div class="bootSub">Dein Atlas wird vorbereitet</div><div class="bootTrack"><i></i></div><div class="bootDots">● ● ●</div></div></div><div id="app"><header class="top"><div><div class="brand">🌍 Geo<span>Master</span></div><div class="tag">Dein interaktiver Geografie-Trainer</div></div><button class="soft" id="homeBtn" onclick="goHome()">⌂ Menü</button></header><main id="view"></main><div class="footer">GeoMaster · Karten und Länder-Daten werden online geladen.</div></div><div id="resultFX"><div class="fx-card"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const view=document.querySelector('#view');let countries=[],geo=null,mode='',direction='',region='',quiz=[],idx=0,results=[],map=null,layer=null,selectedIso='',answered=false,colorHistory={},advanceTimer=null;

// Sovereign-state whitelist: UN 193 members + Holy See + Palestine, plus Taiwan (requested separately).
const SOVEREIGN_CODES=new Set(('AFG ALB DZA AND AGO ATG ARG ARM AUS AUT AZE BHS BHR BGD BRB BLR BEL BLZ BEN BTN BOL BIH BWA BRA BRN BGR BFA BDI CPV KHM CMR CAN CAF TCD CHL CHN COL COM COG COD CRI CIV HRV CUB CYP CZE DNK DJI DMA DOM ECU EGY SLV GNQ ERI EST SWZ ETH FJI FIN FRA GAB GMB GEO DEU GHA GRC GRD GTM GIN GNB GUY HTI HND HUN ISL IND IDN IRN IRQ IRL ISR ITA JAM JPN JOR KAZ KEN KIR PRK KOR KWT KGZ LAO LVA LBN LSO LBR LBY LIE LTU LUX MDG MWI MYS MDV MLI MLT MHL MRT MUS MEX FSM MDA MCO MNG MNE MAR MOZ MMR NAM NRU NPL NLD NZL NIC NER NGA MKD NOR OMN PAK PLW PAN PNG PRY PER PHL POL PRT QAT ROU RUS RWA KNA LCA VCT WSM SMR STP SAU SEN SRB SYC SLE SGP SVK SVN SLB SOM ZAF SSD ESP LKA SDN SUR SWE CHE SYR TJK TZA THA TLS TGO TON TTO TUN TUR TKM TUV UGA UKR ARE GBR USA URY UZB VUT VEN VNM YEM ZMB ZWE VAT PSE TWN').split(' '));

const continents=['Europa','Asien','Nordamerika','Südamerika','Afrika','Australien / Ozeanien','Welt'];const contMap={'Europa':'Europe','Asien':'Asia','Nordamerika':'North America','Südamerika':'South America','Afrika':'Africa','Australien / Ozeanien':'Oceania','Welt':'ALL'};
const emoji={'Flaggen':'🏳️','Lage':'📍','Hauptstädte':'🏙️','Liste':'📚'};
function home(){cleanupMap();view.innerHTML=`<section class="hero"><h1>Wissen, wo die Welt liegt.</h1><p>Trainiere Länder, Flaggen und Hauptstädte – in deinem Tempo.</p></section><div class="grid"><div class="tile" onclick="chooseMode('flag')"><div class="emoji">🏳️</div><h2>Flaggen</h2><p>Flaggen erkennen und Länder finden</p></div><div class="tile" onclick="chooseMode('location')"><div class="emoji">📍</div><h2>Lage</h2><p>Länder auf der Karte entdecken</p></div><div class="tile" onclick="chooseMode('capital')"><div class="emoji">🏙️</div><h2>Hauptstädte</h2><p>Länder und Hauptstädte lernen</p></div><div class="tile" onclick="chooseMode('list')"><div class="emoji">📚</div><h2>Länderliste</h2><p>Alle Länder mit Hauptstadt</p></div></div>`}
function chooseMode(m){mode=m;view.innerHTML=`<section class="panel"><h2 class="heading">${m==='flag'?'🏳️ Flaggen':m==='location'?'📍 Lage':'🏙️ Hauptstädte'} – Auswahl</h2><p class="sub">Wähle eine Region für dein Training.</p><div class="continent-grid">${continents.map(c=>`<button class="continent" onclick="chooseRegion('${c}')">${c==='Welt'?'🌐':({'Europa':'🌍','Asien':'🌏','Nordamerika':'🌎','Südamerika':'🌎','Afrika':'🌍','Australien / Ozeanien':'🌊'}[c]||'🌍')} &nbsp; ${c}</button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="secondary" onclick="home()">← Zurück</button></div></section>`}
function chooseRegion(r){region=r;if(mode==='list'){showList();return}if(mode==='flag'){view.innerHTML=`<section class="panel"><h2 class="heading">Flaggen-Quiz · ${r}</h2><p class="sub">Wie möchtest du üben?</p><div class="grid"><div class="tile" onclick="startQuiz('flagToCountry')"><div class="emoji">🏳️ → 🗺️</div><h2>Flagge → Land</h2><p>Flagge sehen und Land auf Karte anklicken</p></div><div class="tile" onclick="startQuiz('countryToFlag')"><div class="emoji">🗺️ → 🏳️</div><h2>Land → Flagge</h2><p>Land auswählen und richtige Flagge finden</p></div></div><button class="secondary" style="margin-top:15px" onclick="chooseMode('flag')">Zurück</button></section>`}else if(mode==='capital'){view.innerHTML=`<section class="panel"><h2 class="heading">Hauptstadt-Quiz · ${r}</h2><p class="sub">Wähle deine Quizrichtung.</p><div class="grid"><div class="tile" onclick="startQuiz('countryToCapital')"><div class="emoji">🌍 → 🏙️</div><h2>Land → Hauptstadt</h2><p>Vier Städte zur Auswahl</p></div><div class="tile" onclick="startQuiz('capitalToCountry')"><div class="emoji">🏙️ → 🗺️</div><h2>Hauptstadt → Land</h2><p>Hauptstadt sehen und aus vier Ländern wählen</p></div></div><button class="secondary" style="margin-top:15px" onclick="chooseMode('capital')">Zurück</button></section>`}else startQuiz('location')}
async function fetchFirst(urls){let lastError;for(const url of urls){try{const response=await fetch(url);if(!response.ok)throw new Error('HTTP '+response.status+' bei '+url);return await response.json()}catch(err){lastError=err}}throw lastError||new Error('Alle Datenquellen fehlgeschlagen')}
async function loadData(){if(countries.length&&geo)return true;view.innerHTML='<section class="panel"><h2>🌐 Lade Länder & Karten…</h2><p class="sub">Daten werden von mehreren Quellen versucht.</p></section>';try{let [raw,geoData]=await Promise.all([fetchFirst(['https://restcountries.com/v3.1/all?fields=name,translations,cca3,cca2,ccn3,capital,region,subregion,flags','https://raw.githubusercontent.com/mledoze/countries/master/countries.json']),fetchFirst(['https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson','https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson'])]);if(!Array.isArray(raw))throw new Error('Länderdaten haben ein unerwartetes Format');countries=raw.filter(x=>x.cca3&&x.name).map(x=>({name:x.translations?.deu?.common||x.name?.common||x.name?.official||x.name,englishName:x.name?.common||x.name?.official||x.name,iso:x.cca3,iso2:x.cca2,isoNum:x.ccn3,capital:Array.isArray(x.capital)?x.capital[0]:(x.capital||'—'),region:x.region||x.continent||'',subregion:x.subregion||'',flag:x.flags?.svg||x.flags?.png||`https://flagcdn.com/${(x.cca2||'').toLowerCase()}.svg`})).filter(x=>SOVEREIGN_CODES.has(x.iso)&&x.name&&x.name!=='Antarktika'&&x.englishName!=='Antarctica');geo=geoData;if(!geo?.features?.length)throw new Error('Kartenformat nicht erkannt');return true}catch(e){countries=[];geo=null;view.innerHTML='<section class="panel"><h2>⚠️ Länder- oder Kartendaten konnten nicht geladen werden.</h2><p>Die Datei wird lokal geöffnet. Android/Chrome kann dabei externe Daten blockieren (CORS). Das bedeutet nicht automatisch, dass dein Internet kaputt ist.</p><p class="sub">Fehler: '+String(e.message||e).replace(/[<>&]/g,'')+'</p><div class="row"><button onclick="loadData().then(ok=>{if(ok)chooseRegion(region)})">Erneut laden</button><button class="secondary" onclick="chooseMode(mode)">Zurück</button></div></section>';return false}}
function filtered(){let continent=contMap[region];return countries.filter(c=>continent==='ALL'||c.region===continent)}
async function startQuiz(dir){direction=dir;await loadData();if(!countries.length||!geo)return;let pool=filtered().filter(c=>c.iso!=='ATA'&&c.name!=='Antarctica');if(!pool.length){view.innerHTML='<div class="panel">Keine Länder gefunden. Versuch erneut.</div>';return}quiz=pool.sort(()=>Math.random()-.5);idx=0;results=[];colorHistory={};if(advanceTimer)clearTimeout(advanceTimer);renderQuestion()}
function countryFeatureISO(f){let p=f.properties||{};return p.ISO_A3||p.iso_a3||p.ADM0_A3||p.SOV_A3||p.ISO3||p.iso3||p.ISO3166_1_Alpha_3||p.iso3_code||p['ISO3166-1-Alpha-3']||p['ISO 3166-1 alpha-3']||null}
function featureCountry(f){let iso=countryFeatureISO(f);let p=f.properties||{};let name=p.ADMIN||p.name||p.NAME||p.NAME_EN||p.name_en||p.SOVEREIGNT||p.GEOUNIT||p.brk_name||p.NAME_LONG||'';return countries.find(c=>iso&&c.iso===iso)||countries.find(c=>[c.englishName,c.name].some(n=>n&&n.toLowerCase()===String(name).toLowerCase()))}
function cleanupMap(){if(map){map.remove();map=null;layer=null}}
function renderQuestion(){cleanupMap();answered=false;if(idx>=quiz.length){showResults();return}let c=quiz[idx],total=quiz.length;let mapMode=['flagToCountry','location'].includes(direction);let title=direction==='flagToCountry'?'Finde das Land dieser Flagge':direction==='location'?'Finde dieses Land':direction==='capitalToCountry'?'Welches Land gehört zu dieser Hauptstadt?':direction==='countryToFlag'?'Welche Flagge gehört zu diesem Land?':'Welche Hauptstadt gehört zu diesem Land?';let prompt=direction==='flagToCountry'?`<div class="flag"><img src="${c.flag}" alt="Flagge"></div>`:direction==='location'?`<h2>${c.name}</h2>`:direction==='capitalToCountry'?`<h2>${c.capital}</h2>`:direction==='countryToFlag'?`<h2>${c.name}</h2>`:`<h2>${c.name}</h2>`;
view.innerHTML=`<section class="panel"><div class="quiz-head"><div><b>${title}</b><div class="sub">${region} · ${idx+1} von ${total}</div></div><button class="secondary" onclick="goHome()">Quiz beenden</button></div><div class="progress"><div style="width:${idx/total*100}%"></div></div><div class="question">${prompt}</div>${mapMode?`<div class="map-controls">${['flagToCountry','capitalToCountry','location'].includes(direction)?'<button class="gold" onclick="reveal()">Auflösen</button>':''}<span class="sub">Karte zoomen: zwei Finger / Mausrad · Verschieben: ziehen</span></div><div class="mapwrap"><div id="map" class="map"></div></div>`:direction==='countryToFlag'?`<div class="choices">${choiceFlags(c)}</div>`:direction==='capitalToCountry'?`<div class="choices">${choiceCountries(c)}</div>`:`<div class="choices">${choiceCapitals(c)}</div>`}<div id="feedback" class="feedback"></div><div class="row"><button class="secondary hidden" id="nextBtn" onclick="nextQuestion()">Weiter →</button></div></section>`;
if(mapMode)initMap(c);else setupChoices(c)}
function choiceFlags(c){let options=[c,...quiz.filter(x=>x.iso!==c.iso).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);window.currentOptions=options;return options.map((x,i)=>`<button class="choice" onclick="answerChoice(${i})"><img src="${x.flag}" style="height:46px;max-width:100%;object-fit:contain" alt="Flagge"></button>`).join('')}
function choiceCountries(c){let opts=[c,...quiz.filter(x=>x.iso!==c.iso).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);window.currentOptions=opts;return opts.map((x,i)=>`<button class="choice" onclick="answerChoice(${i})">${x.name}</button>`).join('')}
function choiceCapitals(c){let opts=[c,...quiz.filter(x=>x.iso!==c.iso).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);window.currentOptions=opts;return opts.map((x,i)=>`<button class="choice" onclick="answerChoice(${i})">${x.capital}</button>`).join('')}
function setupChoices(c){window.currentAnswer=c}
function answerChoice(i){if(answered)return;answered=true;let selected=window.currentOptions[i],correct=selected.iso===window.currentAnswer.iso;results.push({country:window.currentAnswer,answer:selected,correct,reveal:false});document.querySelectorAll('.choice').forEach((b,j)=>{if(j===i)b.classList.add(correct?'correct':'wrong');if(window.currentOptions[j].iso===window.currentAnswer.iso)b.classList.add('correct')});let answerDetail=direction==='countryToFlag'?window.currentAnswer.name:direction==='capitalToCountry'?`${window.currentAnswer.name} · ${window.currentAnswer.capital}`:window.currentAnswer.capital;feedback(correct?'Richtig! 🎉':`Falsch – richtig ist: ${answerDetail}`,correct);showFX(correct,correct?'RICHTIG!':'FALSCH!',correct?`🎉 ${window.currentAnswer.name}`:`Richtig: ${answerDetail}`);showNext()}
function initMap(c){map=L.map('map',{zoomControl:true,scrollWheelZoom:true,tap:true,touchZoom:true,doubleClickZoom:true,dragging:true}).setView([20,0],2);let continent=contMap[region];let mapFeatures=geo.features.filter(f=>{let cc=featureCountry(f);return cc&&(continent==='ALL'||cc.region===continent)});let style=f=>{let match=featureCountry(f),st=match&&colorHistory[match.iso];return {color:'#283c50',weight:.8,fillColor:st||'#b9c7d6',fillOpacity:st?0.95:0.85}};layer=L.geoJSON({type:'FeatureCollection',features:mapFeatures},{style,onEachFeature:(f,l)=>{let match=featureCountry(f);if(match){if(['flagToCountry','capitalToCountry'].includes(direction)){l.bindTooltip(match.name,{permanent:true,direction:'center',className:'country-label'})}l.on('click',e=>{if(e&&e.originalEvent)e.originalEvent.preventDefault?.();mapAnswer(match)});const b=l.getBounds(),center=b.getCenter(),marker=L.circleMarker(center,{radius:12,stroke:false,fillColor:'#26384a',fillOpacity:0.015,interactive:true,bubblingMouseEvents:false}).addTo(map);marker.on('click',e=>{if(e.originalEvent){e.originalEvent.preventDefault?.();e.originalEvent.stopPropagation?.()}mapAnswer(match)});}else{l.options.interactive=false}}}).addTo(map);map.invalidateSize();if(continent!=='ALL'&&mapFeatures.length){const presets={'Europe':[53,15,5],'Asia':[35,92,4],'North America':[45,-100,4],'South America':[-15,-60,4],'Africa':[0,20,4],'Oceania':[-20,140,4]};const preset=presets[continent];if(preset){map.setView([preset[0],preset[1]],preset[2],{animate:true});}else map.fitBounds(layer.getBounds(),{padding:[18,18],maxZoom:4});}else if(mapFeatures.length){map.fitBounds(layer.getBounds(),{padding:[16,16],maxZoom:2.5});}}

function mapAnswer(selected){if(answered)return;answered=true;let target=quiz[idx],correct=selected.iso===target.iso;colorHistory[selected.iso]=correct?'#25b675':'#e45458';if(!correct)colorHistory[target.iso]='#e8b43d';layer.eachLayer(l=>{let matched=featureCountry(l.feature);if(matched&&colorHistory[matched.iso])l.setStyle({fillColor:colorHistory[matched.iso],fillOpacity:.96})});results.push({country:target,answer:selected,correct,reveal:false});feedback(correct?'Richtig! 🎉':`Falsch – gesucht war ${target.name}.`,correct);showFX(correct,correct?'Richtig!':'Falsch',correct?`🎉 ${target.name}`:`${target.name} · ${target.capital}`);showNext()}
function reveal(){if(answered)return;answered=true;let target=quiz[idx];colorHistory[target.iso]='#e8b43d';layer.eachLayer(l=>{if((featureCountry(l.feature)?.iso)===target.iso)l.setStyle({fillColor:'#e8b43d',fillOpacity:.96})});results.push({country:target,answer:null,correct:false,reveal:true});feedback(`Aufgelöst: ${target.name}`,false);showFX(false,'Aufgelöst',`🟡 ${target.name}`);showNext()}
function feedback(t,correct){let f=document.getElementById('feedback');if(f)f.textContent=t}
function showFX(correct,title,detail){const fx=document.getElementById('resultFX');if(!fx)return;fx.className=correct?'good':'bad';const card=fx.querySelector('.fx-card');let particles='';if(correct){for(let n=0;n<36;n++){let a=Math.random()*Math.PI*2,r=100+Math.random()*Math.max(innerWidth,innerHeight)*.55,dx=Math.cos(a)*r,dy=Math.sin(a)*r,col=['#ffdf4d','#ff6b6b','#57d8ff','#a78bfa','#ffffff'][n%5];particles+=`<span class="fx-particle" style="--dx:${dx}px;--dy:${dy}px;--particle:${col};animation-delay:${Math.random()*.2}s"></span>`}}card.innerHTML=`${particles}<div><span class="bigmark">${correct?'🎉':'✖'}</span>${title}</div><div class="fx-detail">${detail}</div>`;requestAnimationFrame(()=>fx.classList.add('show'));playTone(correct);setTimeout(()=>fx.classList.remove('show'),correct?1900:2700)}
function playTone(correct){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),now=ctx.currentTime;[0,1].forEach((n)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=correct?(n?880:660):(n?220:165);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.22);o.connect(g);g.connect(ctx.destination);o.start(now+n*.09);o.stop(now+.25+n*.09)});setTimeout(()=>ctx.close(),500)}catch(e){}}
function showNext(){if(advanceTimer)clearTimeout(advanceTimer);let last=results[results.length-1];advanceTimer=setTimeout(()=>{idx++;renderQuestion()},last&&last.correct?1950:2850)}
function nextQuestion(){if(advanceTimer)clearTimeout(advanceTimer);idx++;renderQuestion()}
function showResults(){cleanupMap();let correct=results.filter(r=>r.correct).length,reveals=results.filter(r=>r.reveal).length,wrong=results.length-correct-reveals;view.innerHTML=`<section class="panel"><h2 class="heading">🎉 Quiz beendet!</h2><p class="sub">${region} · ${mode==='flag'?'Flaggen':mode==='capital'?'Hauptstädte':'Lage'}</p><div class="stats"><div class="stat" style="color:var(--green)">✓ ${correct} richtig</div><div class="stat" style="color:var(--red)">✕ ${wrong} falsch</div><div class="stat" style="color:#ad7b13">💡 ${reveals} aufgelöst</div></div><h3>Deine Übersicht</h3><div class="review">${results.map(r=>`<div class="reviewrow"><div>${r.country.flag?`<img src="${r.country.flag}" style="height:28px;width:42px;object-fit:contain;vertical-align:middle;margin-right:8px">`:''}<b>${r.country.name}</b><div class="sub">Hauptstadt: ${r.country.capital}</div></div><span class="badge ${r.correct?'b-ok':r.reveal?'b-reveal':'b-no'}">${r.correct?'Richtig':r.reveal?'Aufgelöst':'Falsch'}</span></div>`).join('')}</div><div class="row" style="margin-top:18px"><button onclick="chooseRegion(region)">Nochmal spielen ↻</button><button class="secondary" onclick="home()">Zum Hauptmenü</button></div></section>`}
function showList(){loadData().then(ok=>{if(!ok)return;let list=filtered().sort((a,b)=>a.name.localeCompare(b.name));view.innerHTML=`<section class="panel"><h2 class="heading">📚 Länder & Hauptstädte · ${region}</h2><input class="listsearch" id="search" placeholder="Land oder Hauptstadt suchen…" oninput="filterList()"><div class="list-toggles"><button id="toggleFlag" class="active" onclick="toggleListColumn('flag')">🏳️ Flaggen</button><button id="toggleName" class="active" onclick="toggleListColumn('name')">🌍 Länder</button><button id="toggleCapital" class="active" onclick="toggleListColumn('capital')">🏙️ Hauptstädte</button></div><div class="listbox"><table id="countrytable" class="countrylist"><thead><tr><th>Flagge</th><th>Land</th><th>Hauptstadt</th></tr></thead><tbody id="tbody">${list.map(c=>row(c)).join('')}</tbody></table></div><button class="secondary" style="margin-top:14px" onclick="chooseMode('list')">← Regionen</button></section>`;window.listItems=list;window.listColumnVisibility={flag:true,name:true,capital:true}})}
function toggleListColumn(which){window.listColumnVisibility[which]=!window.listColumnVisibility[which];const table=document.getElementById('countrytable');table.classList.toggle('hide-flag',!window.listColumnVisibility.flag);table.classList.toggle('hide-name',!window.listColumnVisibility.name);table.classList.toggle('hide-capital',!window.listColumnVisibility.capital);document.getElementById({flag:'toggleFlag',name:'toggleName',capital:'toggleCapital'}[which]).classList.toggle('active',window.listColumnVisibility[which])}
function row(c){return `<tr><td><img src="${c.flag}" style="height:24px;width:38px;object-fit:contain"></td><td>${c.name}</td><td>${c.capital}</td></tr>`}function filterList(){let s=document.querySelector('#search').value.toLowerCase();document.querySelector('#tbody').innerHTML=window.listItems.filter(c=>c.name.toLowerCase().includes(s)||c.capital.toLowerCase().includes(s)).map(row).join('')}
function goHome(){home()}home();
</script>
<script>window.addEventListener('load',function(){var loader=document.getElementById('bootLoader');setTimeout(function(){if(loader){loader.classList.add('done');}},900);document.querySelectorAll('.tile,.continent,button').forEach(function(el){el.addEventListener('click',function(){el.classList.remove('tapPulse');void el.offsetWidth;el.classList.add('tapPulse');});});if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js').catch(function(){});}});</script>
